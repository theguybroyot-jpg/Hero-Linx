```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Launcher</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.launcher {
    min-height: 100vh;
    max-width: 900px;
    margin: auto;
    padding: 40px 25px;
}

h1 {
    font-size: 32px;
    margin-bottom: 25px;
}

.top-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 35px;
}

.main-button {
    background: white;
    color: black;
    border: none;
    padding: 14px 25px;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.main-button:hover {
    background: #ddd;
}

.bookmark-section {
    background: #111;
    border: 1px solid #252525;
    border-radius: 14px;
    padding: 20px;
}

.bookmark-section h2 {
    margin-top: 0;
}

#bookmarks {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.bookmark {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #181818;
    border-radius: 9px;
    padding: 13px 15px;
    gap: 10px;
}

.bookmark-info {
    cursor: pointer;
    flex: 1;
}

.bookmark-name {
    font-weight: bold;
    font-size: 16px;
}

.bookmark-id {
    color: #888;
    font-size: 13px;
    margin-top: 4px;
}

.delete-button {
    background: #292929;
    color: white;
    border: none;
    border-radius: 7px;
    padding: 9px 12px;
    cursor: pointer;
}

.delete-button:hover {
    background: #444;
}

.empty {
    color: #777;
    padding: 10px 0;
}
</style>
</head>

<body>

<div class="launcher">

    <h1>Movie Launcher</h1>

    <div class="top-buttons">

        <button class="main-button" onclick="launchMovie()">
            ▶ Launch
        </button>

        <button class="main-button" onclick="addBookmark()">
            🔖 Add Bookmark
        </button>

    </div>

    <div class="bookmark-section">

        <h2>🔖 Bookmarks</h2>

        <div id="bookmarks"></div>

    </div>

</div>


<script>

/* ============================
   SAVED MOVIE BOOKMARKS
============================ */

let bookmarks = JSON.parse(
    localStorage.getItem("movieBookmarks") || "[]"
);


function saveBookmarks() {

    localStorage.setItem(
        "movieBookmarks",
        JSON.stringify(bookmarks)
    );

}


/* ============================
   ADD BOOKMARK
============================ */

function addBookmark() {

    const name = prompt(
        "Enter a name for the movie:"
    );

    if (!name) return;


    const id = prompt(
        "Enter the IMDb ID:"
    );

    if (!id) return;


    bookmarks.push({
        name: name,
        id: id
    });


    saveBookmarks();

    displayBookmarks();

}


/* ============================
   DELETE BOOKMARK
============================ */

function deleteBookmark(index) {

    if (!confirm("Delete this bookmark?")) {
        return;
    }


    bookmarks.splice(index, 1);

    saveBookmarks();

    displayBookmarks();

}


/* ============================
   SHOW BOOKMARKS
============================ */

function displayBookmarks() {

    const container =
        document.getElementById("bookmarks");


    container.innerHTML = "";


    if (bookmarks.length === 0) {

        container.innerHTML =
            '<div class="empty">No bookmarks yet.</div>';

        return;

    }


    bookmarks.forEach((bookmark, index) => {

        const item =
            document.createElement("div");


        item.className = "bookmark";


        item.innerHTML = `

            <div class="bookmark-info">

                <div class="bookmark-name">
                    ${escapeHTML(bookmark.name)}
                </div>

                <div class="bookmark-id">
                    ${escapeHTML(bookmark.id)}
                </div>

            </div>

            <button class="delete-button">
                🗑️
            </button>

        `;


        item.querySelector(".bookmark-info")
            .addEventListener("click", () => {

                openMovie(bookmark.id);

            });


        item.querySelector(".delete-button")
            .addEventListener("click", () => {

                deleteBookmark(index);

            });


        container.appendChild(item);

    });

}


/* ============================
   PROTECT BOOKMARK TEXT
============================ */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* ============================
   LAUNCH BUTTON
============================ */

function launchMovie() {

    const id = prompt(
        "Enter the IMDb ID:"
    );


    if (!id) return;


    openMovie(id);

}


/* ============================
   OPEN MOVIE
============================ */

function openMovie(id) {

    const newTab =
        window.open("about:blank", "_blank");


    if (!newTab) {

        alert(
            "The new tab was blocked. Please allow pop-ups for this site."
        );

        return;

    }


    newTab.document.open();


    newTab.document.write(`

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Movie Player</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #080808;

    color: white;

    font-family: Arial, sans-serif;

}


.container {

    max-width: 1200px;

    margin: auto;

    padding: 25px;

}


h1 {

    margin-bottom: 20px;

}


.player {

    width: 100%;

    aspect-ratio: 16 / 9;

    background: black;

    border-radius: 12px;

    overflow: hidden;

}


iframe {

    width: 100%;

    height: 100%;

    border: none;

}


.controls {

    display: flex;

    justify-content: flex-end;

    margin-top: 15px;

}


button {

    background: #181818;

    color: white;

    border: 1px solid #333;

    border-radius: 8px;

    padding: 11px 16px;

    font-size: 15px;

    cursor: pointer;

}


button:hover {

    background: #292929;

}

</style>

</head>


<body>


<div class="container">

    <h1>Movie Player</h1>


    <div
        class="player"
        id="player">

        <iframe

            src="https://vidsrc.mov/embed/movie/${encodeURIComponent(id)}"

            allowfullscreen>

        </iframe>

    </div>


    <div class="controls">

        <button
            onclick="fullscreenPlayer()">

            ⛶ Fullscreen

        </button>

    </div>

</div>


<script>

function fullscreenPlayer() {

    const player =
        document.getElementById("player");


    if (player.requestFullscreen) {

        player.requestFullscreen();

    }

    else if (player.webkitRequestFullscreen) {

        player.webkitRequestFullscreen();

    }

}

<\/script>


</body>

</html>

    `);


    newTab.document.close();

}


/* ============================
   LOAD SAVED BOOKMARKS
============================ */

displayBookmarks();

</script>

</body>
</html>
```
